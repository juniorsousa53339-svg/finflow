# =====================================================================
# Configura�oes Gerais da Aplic�o
# =====================================================================
spring.application.name=processing-service

# =====================================================================
# Configura��o do Banco de Dados H2 (Em Memória)
# =====================================================================
# URL de conex�o com o H2 em memoria.
# DB_CLOSE_DELAY=-1 garante que o banco permaneça ativo enquanto a JVM estiver rodando.
spring.datasource.url=jdbc:h2:mem:processingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =====================================================================
# Configura��o do Hibernate / JPA
# =====================================================================
# Dialeto espe�ifico para o H2 Database
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ddl-auto=update cria ou atualiza as tabelas automaticamente com base nas entidades JPA
spring.jpa.hibernate.ddl-auto=update
# Exibe as queries SQL executadas no console para fins didáticos e de depuração
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# Console Web do H2
# =====================================================================
# Habilita o console web interativo do H2 em http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# Configurações do Apache Kafka (Consumer)
# =====================================================================
# Endereço do broker Kafka (servidor local)
spring.kafka.bootstrap-servers=localhost:9092

# Group ID identifica o grupo de consumidores ao qual este serviço pertence.
# Fundamental para o Kafka gerenciar o balanceamento de carga e escalabilidade horizontal.
spring.kafka.consumer.group-id=processing-group

# Define o comportamento inicial quando não há offset salvo ou o offset é inválido.
# 'earliest' garante a leitura desde o início das mensagens disponíveis no tópico.
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializador da Chave (Key) - Converte bytes da chave do Kafka para String
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Deserializador do Valor (Value) - Converte o payload JSON recebido de volta para objetos Java (ex: TransferCreatedEvent)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Configuração de segurança e mapeamento do JsonDeserializer:
# Permite confiar em todos os pacotes para mapear o JSON recebido para as classes de evento
spring.kafka.consumer.properties.spring.json.trusted.packages=*
