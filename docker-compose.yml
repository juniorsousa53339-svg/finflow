services:
  # 1. Banco de Dados PostgreSQL para o Processing Service
  postgres-processing:
    image: postgres:15-alpine
    container_name: finflow-processing-postgres
    environment:
      POSTGRES_DB: processingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - processing_postgres_data:/var/lib/postgresql/data
    networks:
      - finflow-processing-network

  # 2. Zookeeper (Gerenciador de metadados para o Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: finflow-processing-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - finflow-processing-network

  # 3. Apache Kafka (Broker de mensageria assíncrona)
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: finflow-processing-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - finflow-processing-network

volumes:
  processing_postgres_data:

networks:
  finflow-processing-network:
    driver: bridge
