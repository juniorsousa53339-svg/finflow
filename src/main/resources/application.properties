# =====================================================================
# Configuracoes Gerais da Aplicacao
# =====================================================================
spring.application.name=processing-service

# =====================================================================
# Configuracao do Banco de Dados H2 (Em Memoria)
# =====================================================================
# URL de conexao com o H2 em memoria.
# DB_CLOSE_DELAY=-1 garante que o banco permaneca ativo enquanto a JVM estiver rodando.
spring.datasource.url=jdbc:h2:mem:processingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
server.port=8081


# =====================================================================
# Configuracao do Hibernate / JPA
# =====================================================================
# Dialeto especifico para o H2 Database
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ddl-auto=update cria ou atualiza as tabelas automaticamente com base nas entidades JPA
spring.jpa.hibernate.ddl-auto=update
# Exibe as queries SQL executadas no console para fins didaticos e de depuracao
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# Console Web do H2
# =====================================================================
# Habilita o console web interativo do H2 em http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# Configuracoes do Apache Kafka (Consumer)
# =====================================================================
# Endereco do broker Kafka (servidor local)
spring.kafka.bootstrap-servers=localhost:9092

# Group ID identifica o grupo de consumidores ao qual este servico pertence.
# Fundamental para o Kafka gerenciar o balanceamento de carga e escalabilidade horizontal.
spring.kafka.consumer.group-id=processing-group

# Define o comportamento inicial quando nao ha offset salvo ou o offset e invalido.
# 'earliest' garante a leitura desde o inicio das mensagens disponiveis no topico.
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializador da Chave (Key) - Converte bytes da chave do Kafka para String
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Deserializador do Valor (Value) - Converte o payload JSON recebido de volta para objetos Java (ex: TransferCreatedEvent)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Configuracao de seguranca e mapeamento do JsonDeserializer:
# Permite confiar em todos os pacotes para mapear o JSON recebido para as classes de evento
spring.kafka.consumer.properties.spring.json.trusted.packages=*
