spring.application.name=processing-service

# Configuração do Banco de Dados H2 em Memória para o Processing Service
spring.datasource.url=jdbc:h2:mem:processingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Configurações do Apache Kafka (Consumer)
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# Group ID identifica o grupo de consumidores ao qual este serviço pertence.
# Permite escalabilidade horizontal (múltiplas instâncias dividindo as partições).
spring.kafka.consumer.group-id=processing-group

# Define o comportamento inicial quando nao ha offset salvo ou o offset é inválido.
# 'earliest' lê desde o início das mensagens disponíveis no tópico.
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializador da Chave (Key) - String
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Deserializador do Valor (Value) - Converte o JSON recebido no Kafka de volta para objetos Java (ex: TransferCreatedEvent)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Configuração de segurança do JsonDeserializer: confia em todos os pacotes para mapear o JSON recebido
spring.kafka.consumer.properties.spring.json.trusted.packages=*
