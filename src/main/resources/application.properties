spring.application.name=transfer-service

# Configuracao do Banco de Dados H2 (Memoria) para Desenvolvimento/Testes
spring.datasource.url=jdbc:h2:mem:finflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracoes do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console do H2 (Disponivel em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Configurações do Apache Kafka (Producer)
# ==========================================
# Endereço do servidor Kafka (broker). No ambiente local/Docker, geralmente é localhost:9092.
spring.kafka.bootstrap-servers=localhost:9092

# Serializador da Chave (Key): O Kafka organiza mensagens em partições usando chaves. Usaremos String.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Serializador do Valor (Value): Converte nosso objeto Java (DTO/Evento) em uma string JSON para trafegar no Kafka.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Configuração opcional para o JsonSerializer: evita adicionar cabeçalhos extras do Spring no JSON, mantendo-o limpo.
spring.kafka.producer.properties.spring.json.add.type.headers=false

