# =====================================================================
# Configuração para Ambiente Docker (PostgreSQL + Kafka)
# =====================================================================
spring.application.name=processing-service

# Conexão com o PostgreSQL rodando no Docker (porta 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/processingdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Apache Kafka rodando no Docker
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=processing-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
