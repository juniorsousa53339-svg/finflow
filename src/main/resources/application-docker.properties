spring.application.name=transfer-service

# ==========================================
# Configuração do Banco de Dados PostgreSQL (Docker)
# ==========================================
# Conectamos na porta 5432 da nossa máquina (que foi mapeada para o container Postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/finflow
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Configurações do Apache Kafka (Docker)
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
